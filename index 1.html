<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>산로그 – 내가 오른 한국의 산</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2ee;--surface:#fff;--ink:#16281f;--muted:#5b6d63;--line:#cfdad2;--pine:#1f4a37;--ridge:#2f7aa0;--gold:#e0a21b;--stamp:#2a5fa8}
@media (prefers-color-scheme:dark){:root{--bg:#0f1a15;--surface:#172620;--ink:#e6efe9;--muted:#93a89b;--line:#2b4036;--pine:#6fc29a;--ridge:#6bb4d8;--gold:#f0b83a;--stamp:#8db6ee}}
*{box-sizing:border-box}
html{scroll-padding-top:12px}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.55 "Noto Sans KR",system-ui,sans-serif}
main{max-width:980px;margin:0 auto;padding:20px 16px 60px}
.hero{background:var(--pine);color:#fff;border-radius:18px;padding:22px 22px 0;overflow:hidden}
@media (prefers-color-scheme:dark){.hero{background:#1b3a2d}}
.hero h1{font:400 15px "Noto Sans KR";margin:0 0 6px;opacity:.8}
.lv{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.lv b{font:400 64px/1 "Black Han Sans","Noto Sans KR",sans-serif}
.lv span{font-size:18px;font-weight:700}
.sub{opacity:.85;font-size:14px;margin:6px 0 0}
.ridge{display:block;width:100%;height:auto;margin-top:14px}
.bar{height:10px;background:rgba(255,255,255,.2);border-radius:6px;margin:14px 0 4px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--gold);transition:width .7s}
.row{display:flex;justify-content:space-between;font-size:13px;opacity:.9;margin-bottom:14px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:18px 0 10px;scrollbar-width:none}
.tab{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 14px;font:500 14px "Noto Sans KR";cursor:pointer}
.tab small{color:var(--muted);margin-left:6px}
.tab[aria-selected=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tab[aria-selected=true] small{color:inherit;opacity:.75}
.tools{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.tools input[type=search]{flex:1;min-width:160px;padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:inherit}
.tools label{font-size:14px;color:var(--muted);display:flex;gap:6px;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.ph{aspect-ratio:4/3;background:repeating-linear-gradient(135deg,var(--bg) 0 10px,var(--surface) 10px 20px);display:grid;place-items:center;color:var(--muted);font-size:13px;cursor:pointer;border:0;width:100%;padding:0}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.info{padding:10px 12px 12px}
.info h3{margin:0;font-size:16px}
.info p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.done .info h3::after{content:" ✓";color:var(--pine)}
.stamp{position:absolute;top:10px;right:10px;width:62px;height:62px;border:3px solid var(--stamp);color:var(--stamp);border-radius:50%;display:grid;place-items:center;text-align:center;font:400 13px/1.1 "Black Han Sans",sans-serif;transform:rotate(-14deg);background:rgba(255,255,255,.75);pointer-events:none}
.stamp small{display:block;font:500 9px "Noto Sans KR"}
.del{position:absolute;left:8px;top:8px;border:0;background:rgba(0,0,0,.55);color:#fff;border-radius:8px;padding:3px 8px;font-size:12px;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--ridge);outline-offset:2px}
.tag{font:500 11px "Noto Sans KR";border:1px solid var(--line);border-radius:6px;padding:1px 6px;margin-left:6px;color:var(--muted);vertical-align:2px}
.add{margin-bottom:14px;font-size:14px}.add summary{cursor:pointer;color:var(--muted)}
.addrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.addrow input,.addrow select{padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:inherit;min-width:0}
.rm{margin-top:6px;border:0;background:none;color:var(--muted);font-size:12px;padding:0;cursor:pointer;text-decoration:underline}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,30px);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;opacity:0;transition:.3s;pointer-events:none;max-width:90vw;text-align:center;z-index:9}
.toast.on{opacity:1;transform:translate(-50%,0)}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:40px 0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
  <section class="hero" aria-live="polite">
    <h1>산로그</h1>
    <div class="lv"><b id="lvNum">1</b><span id="lvTitle">산린이</span></div>
    <p class="sub" id="sub"></p>
    <div class="bar" role="progressbar" aria-label="다음 레벨까지"><i id="xpBar"></i></div>
    <div class="row"><span id="xpTxt"></span><span id="pctTxt"></span></div>
    <svg class="ridge" viewBox="0 0 600 70" preserveAspectRatio="none" aria-hidden="true">
      <defs><clipPath id="clip"><rect id="clipR" x="0" y="0" width="0" height="70"/></clipPath></defs>
      <path d="M0 70 L0 52 L50 30 L90 46 L150 14 L200 40 L260 22 L320 48 L390 8 L450 38 L510 24 L560 44 L600 30 L600 70Z" fill="rgba(255,255,255,.18)"/>
      <path d="M0 70 L0 52 L50 30 L90 46 L150 14 L200 40 L260 22 L320 48 L390 8 L450 38 L510 24 L560 44 L600 30 L600 70Z" fill="#e0a21b" clip-path="url(#clip)"/>
    </svg>
  </section>

  <div class="tabs" id="tabs" role="tablist"></div>
  <div class="tools">
    <input type="search" id="q" placeholder="산 이름 검색" aria-label="산 이름 검색">
    <label><input type="checkbox" id="onlyTodo"> 아직 안 간 산만</label>
  </div>
  <details class="add"><summary>목록에 없는 산 추가하기</summary>
    <div class="addrow"><input id="aN" placeholder="산 이름" aria-label="산 이름"><input id="aH" type="number" min="0" placeholder="높이(m, 선택)" aria-label="높이"><select id="aR" aria-label="지역"></select><button class="tab" id="aB">추가</button></div>
  </details>
  <div class="grid" id="grid"></div>
</main>
<div class="toast" id="toast" role="status"></div>
<input type="file" id="file" accept="image/*" hidden>

<script>
// ===== 산 데이터: 이름|높이(m)|위치 (한 줄에 산 하나) =====
// HOT = 산림청 선정 100대 명산, MORE = 그 외 인기 산. 새 산은 한 줄만 추가하면 됩니다.
const REGIONS = ["서울·경기","강원","충청","전라","경상","제주"];
const HOT = {
"서울·경기": `감악산|675|파주
관악산|629|서울
도봉산|740|서울
마니산|469|인천 강화
백운산|904|포천
북한산|837|서울
소요산|559|동두천
용문산|1157|양평
운악산|936|가평·포천
명지산|1267|가평
유명산|862|가평·양평
천마산|812|남양주
축령산|879|남양주·가평
화악산|1468|가평`,
"강원": `가리산|1051|춘천·홍천
가리왕산|1561|정선·평창
계방산|1577|평창·홍천
공작산|887|홍천
대암산|1304|인제
덕항산|1071|삼척
두타산|1353|동해·삼척
명성산|923|철원
방태산|1436|인제
백덕산|1350|영월·평창
백운산|883|정선
삼악산|645|춘천
설악산|1708|속초·양양·인제
오대산|1563|평창·홍천
오봉산|779|춘천·화천
용화산|878|춘천·화천
응봉산|999|강원·경북
점봉산|1424|양양·인제
치악산|1288|원주·횡성
태백산|1567|태백
태화산|1027|영월
팔봉산|302|홍천`,
"충청": `계룡산|845|공주·논산
구병산|877|보은
금수산|1016|단양·제천
대둔산|878|충남·전북
덕숭산|495|예산
도락산|964|단양
민주지산|1242|영동
서대산|904|금산
소백산|1439|충북·경북
속리산|1057|충북·경북
월악산|1094|제천
천태산|715|영동
칠갑산|561|청양
황악산|1111|충북·경북`,
"전라": `강천산|584|순창
내장산|763|정읍
모악산|794|전주·김제·완주
마이산|685|진안
방장산|742|전북·전남
백암산|741|전북·전남
백운산|1218|광양
변산|508|부안
선운산|336|고창
월출산|809|강진·영암
장안산|1237|장수
적상산|1034|무주
조계산|884|순천
지리산|1915|전북·전남·경남
천관산|723|장흥
추월산|731|전북·전남
팔영산|609|고흥
덕유산|1614|무주
두륜산|700|해남
무등산|1187|광주·전남
운장산|1126|진안
깃대봉|368|신안 홍도`,
"경상": `가야산|1430|경북·경남
가지산|1240|울산·경북·경남
금산|701|남해
금오산|977|구미
금정산|802|부산
남산|466|경주
내연산|710|포항
대야산|931|문경
미륵산|461|통영
무학산|761|마산
비슬산|1084|대구 달성
성인봉|984|울릉도
신불산|1209|울산 울주
연화산|528|고성
운문산|1188|경북·경남
재약산|1189|울산·경남
주왕산|721|청송
주흘산|1106|문경
지이망산|398|통영
천성산|812|울산·경남
청량산|870|봉화
팔공산|1193|대구·경북
화왕산|757|창녕
황매산|1108|산청·합천
황석산|1190|함양
황장산|1077|문경
희양산|998|문경`,
"제주": `한라산|1947|제주`
};
const MORE = {
"서울·경기": `수락산|638|서울·남양주
불암산|509|서울·남양주
청계산|618|서울·성남
북악산|342|서울
인왕산|338|서울
용마산|348|서울
남한산|522|광주·성남
광교산|582|수원·용인`,
"강원": `함백산|1573|정선·태백
태기산|1261|횡성·평창`
};
const TITLES = ["산린이","동네 등산가","주말 산객","능선 러버","산악 탐험가","백두대간 도전자","산악 대장","산신령"];
const XP_PER_LEVEL = 200, KEY = "sanlog.v1";

const parse = (t, r, hot) => t.trim().split("\n").map(l => { const [n, h, p] = l.trim().split("|"); return {id: r + ":" + n, name: n, h: +h || 0, region: r, place: p || "", hot}; });
let custom = [];
try { custom = JSON.parse(localStorage.getItem("sanlog.custom.v1")) || []; } catch (e) {}
let all = [];
const rebuild = () => { all = [...REGIONS.flatMap(r => [...parse(HOT[r], r, true), ...(MORE[r] ? parse(MORE[r], r, false) : [])]), ...custom]; };
rebuild();
const fil = n => n === "전체" ? all : n === "100대 명산" ? all.filter(m => m.hot) : all.filter(m => m.region === n);
const esc = t => String(t).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function saveCustom() { try { localStorage.setItem("sanlog.custom.v1", JSON.stringify(custom)); } catch (e) { toast("저장 공간이 가득 찼어요."); } }
const xpOf = m => 50 + Math.round(m.h / 20);

let log = {};
try { log = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { log = {}; }
let region = "전체", pending = null, lastLevel = null;
const $ = id => document.getElementById(id);

function save() {
  try { localStorage.setItem(KEY, JSON.stringify(log)); return true; }
  catch (e) { toast("저장 공간이 가득 찼어요. 사진 몇 장을 지우고 다시 시도해 주세요."); return false; }
}
function toast(msg) {
  const t = $("toast"); t.textContent = msg; t.classList.add("on");
  clearTimeout(toast.id); toast.id = setTimeout(() => t.classList.remove("on"), 3200);
}

// ===== 사진 압축: 긴 변 800px, WebP(미지원 시 JPEG) 품질 0.6 =====
function compress(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const s = Math.min(1, 800 / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      let out = c.toDataURL("image/webp", 0.6);
      if (!out.startsWith("data:image/webp")) out = c.toDataURL("image/jpeg", 0.6);
      resolve(out);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("load")); };
    img.src = url;
  });
}

// ===== 레벨 / 퍼센트 =====
function stats() {
  const done = all.filter(m => log[m.id]);
  const xp = done.reduce((s, m) => s + xpOf(m), 0);
  return {done: done.length, xp, level: Math.floor(xp / XP_PER_LEVEL) + 1};
}
function renderHero() {
  const s = stats(), into = s.xp % XP_PER_LEVEL, pct = Math.round(s.done / all.length * 100);
  $("lvNum").textContent = "Lv." + s.level;
  $("lvTitle").textContent = TITLES[Math.min(Math.floor((s.level - 1) / 3), TITLES.length - 1)];
  $("sub").textContent = s.done ? `${all.length}개 중 ${s.done}개 산을 올랐어요. 100대 명산 ${all.filter(m => m.hot && log[m.id]).length}/100` : "첫 산 사진을 올리면 레벨이 시작돼요.";
  $("xpBar").style.width = (into / XP_PER_LEVEL * 100) + "%";
  $("xpTxt").textContent = `다음 레벨까지 ${XP_PER_LEVEL - into} XP`;
  $("pctTxt").textContent = `전국 정복 ${pct}%`;
  $("clipR").setAttribute("width", 600 * pct / 100);
  if (lastLevel !== null && s.level > lastLevel) toast(`🎉 레벨 업! Lv.${s.level} 달성`);
  lastLevel = s.level;
}

function renderTabs() {
  const names = ["전체", "100대 명산", ...REGIONS];
  $("tabs").innerHTML = "";
  names.forEach(n => {
    const list = fil(n);
    const d = list.filter(m => log[m.id]).length;
    const b = document.createElement("button");
    b.className = "tab"; b.setAttribute("role", "tab"); b.setAttribute("aria-selected", n === region);
    b.innerHTML = `${n}<small>${d}/${list.length}</small>`;
    b.onclick = () => { region = n; render(); };
    $("tabs").appendChild(b);
  });
}

function renderGrid() {
  const q = $("q").value.trim(), todo = $("onlyTodo").checked;
  const list = all.filter(m => fil(region).includes(m) && m.name.includes(q) && (!todo || !log[m.id]));
  const g = $("grid"); g.innerHTML = "";
  if (!list.length) { g.innerHTML = '<p class="empty">조건에 맞는 산이 없어요. 검색어나 필터를 바꿔 보세요.</p>'; return; }
  list.forEach(m => {
    const rec = log[m.id], el = document.createElement("article");
    el.className = "card" + (rec ? " done" : "");
    const ph = document.createElement("button");
    ph.className = "ph"; ph.setAttribute("aria-label", m.name + (rec ? " 사진 바꾸기" : " 사진 올리기"));
    if (rec) { const i = new Image(); i.src = rec.img; i.alt = m.name + " 등정 사진"; ph.appendChild(i); } else ph.textContent = "사진 올리기";
    ph.onclick = () => { pending = m; $("file").value = ""; $("file").click(); };
    const info = document.createElement("div"); info.className = "info";
    info.innerHTML = `<h3>${esc(m.name)}${m.hot ? '<span class="tag">100대</span>' : ""}</h3><p>${m.region}${m.place ? " · " + esc(m.place) : ""}${m.h ? " · " + m.h.toLocaleString() + "m" : ""} · +${xpOf(m)} XP${rec ? " · " + rec.date : ""}</p>`;
    if (m.custom) { const x = document.createElement("button"); x.className = "rm"; x.textContent = "목록에서 제거"; x.onclick = () => { if (confirm(m.name + "을(를) 목록에서 제거할까요? 사진 기록도 함께 지워져요.")) { custom = custom.filter(c => c.id !== m.id); delete log[m.id]; saveCustom(); save(); rebuild(); render(); } }; info.appendChild(x); }
    el.append(ph, info);
    if (rec) {
      el.insertAdjacentHTML("beforeend", '<div class="stamp" aria-hidden="true">등정<small>완료</small></div>');
      const d = document.createElement("button"); d.className = "del"; d.textContent = "삭제";
      d.onclick = () => { if (confirm(m.name + " 기록을 삭제할까요?")) { delete log[m.id]; save(); render(); } };
      el.appendChild(d);
    }
    g.appendChild(el);
  });
}

function render() { renderHero(); renderTabs(); renderGrid(); }

$("file").addEventListener("change", async e => {
  const f = e.target.files[0]; if (!f || !pending) return;
  const m = pending; pending = null;
  try {
    const img = await compress(f);
    const had = !!log[m.id];
    log[m.id] = {img, date: new Date().toISOString().slice(0, 10)};
    if (!save()) { if (!had) delete log[m.id]; return; }
    toast(`${m.name} 등정 완료! +${xpOf(m)} XP (사진 ${Math.round(img.length * 0.75 / 1024)}KB로 압축)`);
    render();
  } catch (err) { toast("사진을 읽지 못했어요. JPG 또는 PNG 파일인지 확인해 주세요."); }
});
REGIONS.forEach(r => $("aR").add(new Option(r, r)));
$("aB").onclick = () => {
  const n = $("aN").value.trim(), r = $("aR").value;
  if (!n) return toast("산 이름을 입력해 주세요.");
  if (all.some(m => m.region === r && m.name === n)) return toast("이미 목록에 있는 산이에요.");
  custom.push({id: r + ":" + n, name: n, h: +$("aH").value || 0, region: r, place: "직접 추가", custom: 1});
  saveCustom(); rebuild(); $("aN").value = $("aH").value = ""; toast(n + " 추가 완료. 카드에서 사진을 올려 보세요."); render();
};
$("q").addEventListener("input", renderGrid);
$("onlyTodo").addEventListener("change", renderGrid);
render();
</script>
</body>
